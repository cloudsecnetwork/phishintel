<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="font-family: Arial, sans-serif; font-size: 16px; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <p>Hi <strong>{{ firstName }}</strong>,</p>

  <p>Your account at <strong>{{ company }}</strong> ({{ email }}) requires immediate attention.
     We detected a sign-in from an unrecognized device in {{ country }}.</p>

  <p style="text-align: center; margin: 28px 0;">
    <a href="{{ link }}"
       style="display: inline-block; padding: 12px 28px; background-color: #1976d2; color: #ffffff; text-decoration: none; border-radius: 4px; font-weight: bold;">
      Verify My Identity
    </a>
  </p>

  <p>If you have questions, contact the <strong>{{ department }}</strong> team.</p>

  <p>Thanks,<br><strong>{{ company }}</strong> Security Team</p>
</body>
</html>
